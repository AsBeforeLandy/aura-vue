name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

# changesets/action 需要写权限：它会把 version commit 推回主分支、
# 创建/更新 "Version Packages" PR，并打 tag。
# 不显式声明会落到仓库默认权限（新仓库默认为只读 contents），
# 表现为发布步骤静默失败——这正是「配了 NPM_TOKEN 却发不出去」的常见原因。
permissions:
  contents: write
  pull-requests: write
  # npm provenance 通过 OIDC 签发，需要 id-token 写权限
  id-token: write

# 仓库 Secrets 里配置了 NPM_TOKEN 后发布流程才会真正执行；
# 未配置时仅跳过发布步骤（env 上下文只能用于步骤级 if，不能用于 job 级 if）
env:
  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # changesets 需要完整历史来判断哪些 changeset 尚未被消费
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          # 与本地开发版本一致（lockfile 为 pnpm 7 的 lockfileVersion 5.4，pnpm 9+ 无法读取）
          version: 7.33.7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 发布前的校验与 CI 保持同一份门禁：不通过就不该发出去。
      # 失败自动重试一次（共享 runner 偶发失败已三次观测），两轮日志
      # 都落盘上传，重试也失败时才有根因定位的材料。
      - name: Verify
        run: |
          pnpm verify 2>&1 | tee verify.log; code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            echo "::warning::verify 第一次失败（可能是 runner 偶发），自动重试一次"
            pnpm verify 2>&1 | tee verify-retry.log; code=${PIPESTATUS[0]}
          fi
          exit $code

      - name: Upload verify log
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: release-verify-log
          path: |
            verify.log
            verify-retry.log
          retention-days: 7

      # 发布流程采用 main 直发（无版本 PR）：
      # changesets/action 的建 PR 路径依赖仓库的「允许 Actions 建 PR」开关，
      # 单人维护场景下这个环节只有摩擦、没有评审价值——门禁已由上面的
      # verify 全量把守，版本变更内容可在 CHANGELOG 里审计。
      # 有 changeset 时：version 消费它们 → 提交回 main → publish 发布；
      # 无 changeset 时：version 是 no-op，publish 无可发布版本自然退出。
      - name: Version packages
        if: ${{ env.NPM_TOKEN != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          pnpm changeset version
          if git diff --quiet; then
            echo "没有待消费的 changeset，跳过 version"
          else
            git add -A
            git commit -m "chore(release): version packages [skip ci]"
            git push
          fi

      - name: Publish to npm
        if: ${{ env.NPM_TOKEN != '' }}
        run: pnpm changeset publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # 生成 provenance 声明（供应链可追溯）。放在这里而不是包的 publishConfig，
          # 是为了不影响维护者本地手动发布——provenance 依赖 CI 的 OIDC，本地会直接失败。
          NPM_CONFIG_PROVENANCE: true

      - name: Push release tags
        if: ${{ env.NPM_TOKEN != '' }}
        run: git push --follow-tags
