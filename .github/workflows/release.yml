name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

# changesets/action 需要写权限：它会把 version commit 推回主分支、
# 创建/更新 "Version Packages" PR，并打 tag。
# 不显式声明会落到仓库默认权限（新仓库默认为只读 contents），
# 表现为发布步骤静默失败——这正是「配了 NPM_TOKEN 却发不出去」的常见原因。
permissions:
  contents: write
  pull-requests: write
  # npm provenance 通过 OIDC 签发，需要 id-token 写权限
  id-token: write

# 仓库 Secrets 里配置了 NPM_TOKEN 后发布流程才会真正执行；
# 未配置时仅跳过发布步骤（env 上下文只能用于步骤级 if，不能用于 job 级 if）
env:
  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # changesets 需要完整历史来判断哪些 changeset 尚未被消费
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          # 与本地开发版本一致（lockfile 为 pnpm 7 的 lockfileVersion 5.4，pnpm 9+ 无法读取）
          version: 7.33.7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 发布前的校验与 CI 保持一致：不通过就不该发出去。
      # 这里刻意复用单步 verify，而不是再抄一份步骤清单——
      # 同一份链路定义在两处必然漂移。
      #
      # 失败自动重试一次：verify 在共享 runner 上已观测到两次「CI 全绿、
      # Release 偶发失败」（相邻 commit、相同命令），重试通过视为环境偶发。
      # 两次的日志都落盘上传——重试也失败时才有根因定位的材料，
      # 连续两轮都过不了就是真问题，不该发布。
      - name: Verify
        run: |
          pnpm verify 2>&1 | tee verify.log; code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            echo "::warning::verify 第一次失败（可能是 runner 偶发），自动重试一次"
            pnpm verify 2>&1 | tee verify-retry.log; code=${PIPESTATUS[0]}
          fi
          exit $code

      - name: Upload verify log
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: release-verify-log
          path: |
            verify.log
            verify-retry.log
          retention-days: 7

      - name: Publish to npm
        if: ${{ env.NPM_TOKEN != '' }}
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
          version: pnpm changeset version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # 生成 provenance 声明（供应链可追溯）。放在这里而不是包的 publishConfig，
          # 是为了不影响维护者本地手动发布——provenance 依赖 CI 的 OIDC，本地会直接失败。
          NPM_CONFIG_PROVENANCE: true
