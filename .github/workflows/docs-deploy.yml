name: Deploy Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages 部署所需的最低权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一次部署，新推送取消进行中的旧部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # 与本地开发版本一致（lockfile 为 pnpm 7 的 lockfileVersion 5.4）
          version: 7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        # 文档站 demo 从 @aura/components 的 dist 引入组件 JS，需先构建
        run: pnpm build

      - name: Build docs
        run: pnpm docs:build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
